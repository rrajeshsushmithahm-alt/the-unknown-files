name: Render THE UNKNOWN FILES videos

on:
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: "Upload the three rendered videos to YouTube as PRIVATE"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 12 * * 1"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out channel project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free rendering and YouTube tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install Pillow google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - name: Render long video and Shorts
        run: python scripts/render.py
      - name: Upload videos to YouTube as PRIVATE
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_youtube == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/upload_youtube.py
      - name: Save rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: the-unknown-files-videos
          path: output/
          retention-days: 14
